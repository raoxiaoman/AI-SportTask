name: Android 自动打包

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: '手动构建的版本号（如 1.0.0），留空则为 dev-<sha>'
        required: false
        default: ''
      build_release:
        description: '是否同时构建签名 release 包'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 单测 + APK 打包
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle（含依赖缓存）
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # 不用 android-actions/setup-android：它会执行 sdkmanager tools，
      # 而新版 SDK 仓库已移除该包，直接导致 exit 1。runner 镜像自带 SDK。
      - name: 定位 Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f -perm -u+x 2>/dev/null | head -1)
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::未找到 sdkmanager，SDK_ROOT=$SDK_ROOT"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "sdkmanager: $SDKMANAGER"

      - name: 接受许可并安装 SDK 组件
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          if ! "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /tmp/sdk-install.log 2>&1; then
            cat /tmp/sdk-install.log
            exit 1
          fi
          "$SDKMANAGER" --list_installed | grep -E "platforms;android-34|build-tools;34" || true

      - name: 计算版本号
        id: ver
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD_RELEASE: ${{ inputs.build_release }}
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          IS_TAG=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then IS_TAG=true; fi
          if [ "$IS_TAG" = "true" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="dev-$SHORT_SHA"
          fi
          VERSION=$(printf '%s' "$VERSION" | tr -cd '0-9A-Za-z._-')
          [ -n "$VERSION" ] || VERSION="dev-$SHORT_SHA"
          BUILD_RELEASE=false
          if [ "$IS_TAG" = "true" ] || { [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_BUILD_RELEASE" = "true" ]; }; then
            BUILD_RELEASE=true
          fi
          {
            echo "version=$VERSION"
            echo "version_code=$GITHUB_RUN_NUMBER"
            echo "short_sha=$SHORT_SHA"
            echo "build_release=$BUILD_RELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "version=$VERSION versionCode=$GITHUB_RUN_NUMBER release=$BUILD_RELEASE"

      - name: 单元测试 + Debug APK
        run: |
          ./gradlew :shared:testDebugUnitTest :androidApp:assembleDebug \
            -Papp.versionName="${{ steps.ver.outputs.version }}" \
            -Papp.versionCode="${{ steps.ver.outputs.version_code }}" \
            --console=plain --no-daemon

      - name: 构建签名 Release APK
        if: steps.ver.outputs.build_release == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          KS_FILE="$RUNNER_TEMP/sporttask-release.keystore"
          printf '%s\n' "$KS_B64" | base64 -d > "$KS_FILE"
          chmod 600 "$KS_FILE"
          # 通过环境变量注入 Gradle 属性，密码不进入命令行
          export ORG_GRADLE_PROJECT_keystorePath="$KS_FILE"
          export ORG_GRADLE_PROJECT_keystoreStorePassword="$KS_STORE_PASS"
          export ORG_GRADLE_PROJECT_keystoreKeyPassword="$KS_KEY_PASS"
          export ORG_GRADLE_PROJECT_keystoreKeyAlias="$KS_ALIAS"
          ./gradlew :androidApp:assembleRelease \
            -Papp.versionName="${{ steps.ver.outputs.version }}" \
            -Papp.versionCode="${{ steps.ver.outputs.version_code }}" \
            --console=plain --no-daemon
          rm -f "$KS_FILE"

      - name: 整理 APK 产物
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          SHORT_SHA: ${{ steps.ver.outputs.short_sha }}
        shell: bash
        run: |
          mkdir -p ci-output
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk \
            "ci-output/AI-SportTask-debug-${VERSION}-${SHORT_SHA}.apk"
          REL="androidApp/build/outputs/apk/release/androidApp-release.apk"
          if [ -f "$REL" ]; then
            cp "$REL" "ci-output/AI-SportTask-v${VERSION}-release.apk"
          fi
          ls -lh ci-output/

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-SportTask-apk-${{ github.run_number }}
          path: ci-output/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: shared/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: 发布 GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 下载 APK
        uses: actions/download-artifact@v4
        with:
          name: AI-SportTask-apk-${{ github.run_number }}
          path: ci-output

      # 正式 Release 只附签名包；debug 包保留在 Actions Artifacts 中供日常自测
      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: AI SportTask ${{ github.ref_name }}
          files: ci-output/AI-SportTask-v*-release.apk
          body: |
            ## 下载

            `AI-SportTask-${{ github.ref_name }}-release.apk` 为正式签名包，可直接安装。

            ## 安装注意

            - 若此前安装过 **Debug 包**，签名不同，需先卸载旧版再安装（卸载会清空本地数据，请先在「设置 → 导出数据」备份 JSON）。
            - 之后的版本可直接覆盖安装，无需卸载。
            - 云同步默认指向本机地址，如需同步请在登录页「服务器设置」填写实际服务器地址。

            ## 本次变更

            详见下方自动生成的更新说明。
          generate_release_notes: true
