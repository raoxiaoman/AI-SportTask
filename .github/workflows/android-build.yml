name: Android 自动打包

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 单测 + Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle（含依赖缓存）
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # 不用 android-actions/setup-android：它会执行 sdkmanager tools，
      # 而新版 SDK 仓库已移除该包，直接导致 exit 1。runner 镜像自带 SDK。
      - name: 定位 Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f -perm -u+x 2>/dev/null | head -1)
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::未找到 sdkmanager，SDK_ROOT=$SDK_ROOT"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "sdkmanager: $SDKMANAGER"

      - name: 接受许可并安装 SDK 组件
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          if ! "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /tmp/sdk-install.log 2>&1; then
            cat /tmp/sdk-install.log
            exit 1
          fi
          "$SDKMANAGER" --list_installed | grep -E "platforms;android-34|build-tools;34" || true

      - name: 运行单元测试并打包
        run: ./gradlew :shared:testDebugUnitTest :androidApp:assembleDebug --console=plain --no-daemon

      - name: 整理 APK 产物
        run: |
          mkdir -p ci-output
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk \
            "ci-output/AI-SportTask-debug-${SHORT_SHA}.apk"
          ls -lh ci-output/

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-SportTask-debug-${{ github.run_number }}
          path: ci-output/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: shared/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 下载 APK
        uses: actions/download-artifact@v4
        with:
          name: AI-SportTask-debug-${{ github.run_number }}
          path: ci-output

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ci-output/*.apk
          generate_release_notes: true
