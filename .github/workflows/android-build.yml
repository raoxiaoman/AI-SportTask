name: Android 自动打包

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 单测 + Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle（含依赖缓存）
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 SDK 组件
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null

      - name: 运行单元测试并打包
        run: ./gradlew :shared:testDebugUnitTest :androidApp:assembleDebug --console=plain --no-daemon

      - name: 整理 APK 产物
        run: |
          mkdir -p ci-output
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk \
            "ci-output/AI-SportTask-debug-${SHORT_SHA}.apk"
          ls -lh ci-output/

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-SportTask-debug-${{ github.run_number }}
          path: ci-output/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: shared/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 下载 APK
        uses: actions/download-artifact@v4
        with:
          name: AI-SportTask-debug-${{ github.run_number }}
          path: ci-output

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ci-output/*.apk
          generate_release_notes: true
